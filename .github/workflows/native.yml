name: Native build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Stamp this version into the sources before building (release only).
        type: string
        default: ""
  pull_request:
    paths:
      - native/**
      - .github/workflows/native.yml
      - package.json
      - package-lock.json

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: engine-${{ matrix.target }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            exe: opencode-converse
          - os: ubuntu-24.04
            target: linux-x64
            exe: opencode-converse
          - os: windows-latest
            target: win32-x64
            exe: opencode-converse.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 26
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: native
          key: ${{ matrix.target }}
      - name: Install meson and ninja
        run: brew install meson ninja
        if: runner.os == 'macOS'
      - name: Install meson and ninja
        run: python3 -m pip install --user meson ninja
        if: runner.os == 'Linux'
      - name: Install meson and ninja
        run: python -m pip install meson ninja
        if: runner.os == 'Windows'
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libclang-dev pkg-config cmake
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Windows MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Windows libclang
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install llvm --yes --no-progress --limit-output || true
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      - name: Set release version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/set-version.mjs "$VERSION"
      - name: Build engine
        if: runner.os != 'Windows'
        run: node native/scripts/build.mjs
      - name: Build engine (MSVC)
        if: runner.os == 'Windows'
        env:
          CC: cl
          CXX: cl
          CARGO_TARGET_DIR: C:\t
          # bindgen's libclang can be older than the runner's MSVC STL requires.
          BINDGEN_EXTRA_CLANG_ARGS: -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
        run: node native/scripts/build.mjs
      - name: Stage executable
        shell: bash
        run: |
          mkdir -p dist
          bin="native/target/release"
          if [ "${{ runner.os }}" = Windows ]; then bin="/c/t/release"; fi
          cp "$bin/${{ matrix.exe }}" "dist/${{ matrix.exe }}"
          ls -l dist
          echo "### ${{ matrix.target }} binary size" >> "$GITHUB_STEP_SUMMARY"
          wc -c < "dist/${{ matrix.exe }}" | awk '{printf "%s bytes (%.1f MiB)\n", $1, $1/1048576}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Smoke test
        shell: bash
        run: ./dist/${{ matrix.exe }} --version
      - name: Dynamic dependencies
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) ldd dist/${{ matrix.exe }} ;;
            macOS) otool -L dist/${{ matrix.exe }} ;;
            Windows) "$(vswhere -latest -find 'VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe' | head -1)" //dependents dist/${{ matrix.exe }} || true ;;
          esac
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: engine-${{ matrix.target }}
          path: dist/${{ matrix.exe }}
          retention-days: 7
          if-no-files-found: error
