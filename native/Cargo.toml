[workspace]
resolver = "2"
members = [
  "runtime",
  "crates/ve-audio",
  "crates/ve-asr",
  "crates/ve-vad",
  "crates/ve-turn",
  "crates/ve-tts",
]
default-members = ["runtime"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[patch.crates-io]
# Adds MSVC support to the bundled build; see vendor/webrtc-audio-processing-sys/README.opencode.md
webrtc-audio-processing-sys = { path = "vendor/webrtc-audio-processing-sys" }

[profile.release]
lto = "thin"
