[package]
name = "ve-asr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "English Moonshine v2 streaming-small speech recognition for OpenCode Converse"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# Same ORT API and static linking as ve-vad/ve-turn; they share one process environment.
ort = { version = "=2.0.0-rc.15", default-features = false, features = [
  "std",
  "api-17",
  "download-binaries",
  "tls-native",
] }
ve-vad = { path = "../ve-vad" }
